name: Proponi un'idea
description: Una funzione nuova o un miglioramento per Keep Watching
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: L'idea
      description: Cosa vorresti che facesse l'estensione.
    validations:
      required: true
  - type: textarea
    id: perche
    attributes:
      label: A cosa ti serve
      description: In quale situazione ti capita (per esempio «mi addormento durante le serie lunghe»).
    validations:
      required: true
  - type: input
    id: versione
    attributes:
      label: Versione di Keep Watching
      placeholder: "es. 1.6.1"
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "es. Brave su Windows 11"
