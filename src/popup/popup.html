<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Keep_Watching</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../../icons/icon48.png" alt="" width="28" height="28">
    <h1>Keep_Watching</h1>
    <span class="version" id="version"></span>
  </header>

  <section class="master">
    <label class="row">
      <span class="text">
        <span class="title">Estensione attiva</span>
        <span class="hint" id="shortcutHint"></span>
      </span>
      <input type="checkbox" class="switch" id="enabled">
    </label>
  </section>

  <main id="options">
    <h2>Episodi</h2>

    <label class="row">
      <span class="text">
        <span class="title">Prossimo episodio automatico</span>
        <span class="hint">A fine episodio passa al successivo</span>
      </span>
      <input type="checkbox" class="switch" id="autoNext">
    </label>

    <label class="row">
      <span class="text">
        <span class="title">Avvia il nuovo episodio</span>
        <span class="hint">Se si carica in pausa, lo fa partire</span>
      </span>
      <input type="checkbox" class="switch" id="autoPlay">
    </label>

    <label class="row">
      <span class="text">
        <span class="title">Resta a schermo intero</span>
        <span class="hint">Tra un episodio e l'altro. Esc per uscire</span>
      </span>
      <input type="checkbox" class="switch" id="keepFullscreen">
    </label>

    <div class="group" id="nextOptions">
      <label class="field">
        <span class="title">Conto alla rovescia</span>
        <select id="countdown">
          <option value="0">No, cambia subito</option>
          <option value="5">5 secondi</option>
          <option value="10">10 secondi</option>
          <option value="15">15 secondi</option>
          <option value="20">20 secondi</option>
        </select>
      </label>

      <div class="field">
        <label class="title" for="skipCredits">Salta i titoli di coda</label>
        <select id="skipCredits">
          <option value="0">No, aspetta la fine</option>
          <option value="15">15 secondi prima della fine</option>
          <option value="30">30 secondi prima della fine</option>
          <option value="60">1 minuto prima della fine</option>
          <option value="90">90 secondi prima della fine</option>
          <option value="120">2 minuti prima della fine</option>
          <option value="custom">Personalizzato…</option>
        </select>
        <div class="custom" id="customSkip" hidden>
          <label class="num">
            <input type="number" id="skipMin" min="0" max="59" step="1" inputmode="numeric" aria-label="Minuti">
            <span>min</span>
          </label>
          <label class="num">
            <input type="number" id="skipSec" min="0" max="59" step="1" inputmode="numeric" aria-label="Secondi">
            <span>sec</span>
          </label>
        </div>
        <p class="hint" id="skipHint" hidden></p>
        <p class="hint">Le serie con i titoli segnati dal player usano il loro valore.</p>
      </div>

      <div class="field">
        <label class="title" for="stopAfter">Chiedi se continuare dopo</label>
        <select id="stopAfter">
          <option value="0">Mai, continua sempre</option>
          <option value="1">1 episodio</option>
          <option value="2">2 episodi</option>
          <option value="3">3 episodi</option>
          <option value="5">5 episodi</option>
          <option value="10">10 episodi</option>
        </select>
      </div>

      <div class="streak" id="streakBox">
        <span id="streakText"></span>
        <button type="button" id="resetStreak">Azzera</button>
      </div>
    </div>

    <h2>Timer di spegnimento</h2>

    <div class="block">
      <div class="field">
        <select id="sleepMode" aria-label="Timer di spegnimento">
          <option value="off">Disattivato</option>
          <option value="15">Tra 15 minuti</option>
          <option value="30">Tra 30 minuti</option>
          <option value="45">Tra 45 minuti</option>
          <option value="60">Tra 1 ora</option>
          <option value="90">Tra 1 ora e mezza</option>
          <option value="episode">Alla fine dell'episodio</option>
          <option value="season">Alla fine della stagione</option>
        </select>
        <p class="hint" id="sleepHint" hidden></p>
      </div>
    </div>

    <label class="row">
      <span class="text">
        <span class="title">Abbassa il volume prima</span>
        <span class="hint">Dissolvenza negli ultimi 30 secondi</span>
      </span>
      <input type="checkbox" class="switch" id="sleepFade">
    </label>

    <h2>Intro delle serie</h2>

    <label class="row">
      <span class="text">
        <span class="title">Salta l'intro</span>
        <span class="hint">Nelle serie in cui l'hai segnata dal player</span>
      </span>
      <input type="checkbox" class="switch" id="introSkip">
    </label>

    <div class="block">
      <p class="hint" id="seriesEmpty">Nessuna serie salvata. Sul player usa "Fine intro qui" e "Inizio titoli qui".</p>
      <ul class="series" id="seriesList"></ul>
    </div>

    <h2>Altro</h2>

    <label class="row">
      <span class="text">
        <span class="title">Pausa quando cambi scheda</span>
        <span class="hint">Riprende quando torni sul video</span>
      </span>
      <input type="checkbox" class="switch" id="pauseOnHidden">
    </label>

    <label class="row">
      <span class="text">
        <span class="title">Riparti se lo streaming si blocca</span>
        <span class="hint">Salto avanti, poi ricarica dal punto in cui eri</span>
      </span>
      <input type="checkbox" class="switch" id="watchdog">
    </label>

    <label class="row">
      <span class="text">
        <span class="title">Notifiche sul desktop</span>
        <span class="hint">Fine episodi, limite, timer e problemi</span>
      </span>
      <input type="checkbox" class="switch" id="notifyEnd">
    </label>
  </main>

  <script src="../defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
